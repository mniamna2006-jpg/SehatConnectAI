<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SehatConnectAI — Hospital Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000000;--bg-alt:#050505;--surface:rgba(0,168,107,0.05);--surface-2:rgba(255,255,255,0.05);--surface-3:rgba(255,255,255,0.08);--surface-4:rgba(255,255,255,0.10);--teal:#00A86B;--teal-dark:#0D7A4A;--teal-deeper:#086B3E;--teal-subtle:rgba(0,168,107,0.1);--teal-glow:rgba(0,168,107,0.22);--green-soft:#1A3A2A;--text:#FFFFFF;--text-secondary:#C8D8D0;--text-muted:#7A8A82;--text-dim:#4A5A52;--border:rgba(0,168,107,0.1);--border-subtle:rgba(255,255,255,0.06);--border-focus:rgba(0,168,107,0.45);--danger:#FF6B6B;--danger-light:rgba(255,107,107,0.12);--amber:#FFB340;--amber-light:rgba(255,179,64,0.12);--ok:#00A86B;--ok-light:rgba(0,168,107,0.12);--blue:#5B9AFF;--blue-light:rgba(91,154,255,0.12);--radius:12px;--radius-sm:8px;--radius-lg:16px;--shadow:0 2px 8px rgba(0,0,0,0.4);--shadow-lg:0 8px 32px rgba(0,0,0,0.5);--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--font-display:'Plus Jakarta Sans','Inter',sans-serif;--sidebar-w:270px;--topbar-h:60px}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
select{appearance:auto}select option{background:#000;color:var(--text)}

.ambient-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.ambient-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 10% 10%,rgba(0,168,107,0.03) 0%,transparent 50%),radial-gradient(ellipse 60% 40% at 90% 90%,rgba(0,60,40,0.06) 0%,transparent 40%)}
.noise-texture{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.015;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

#app{display:flex;min-height:100vh;position:relative;z-index:1}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:margin-left .3s cubic-bezier(.22,1,.36,1);z-index:30}
#sidebar::-webkit-scrollbar{width:4px}#sidebar::-webkit-scrollbar-track{background:transparent}#sidebar::-webkit-scrollbar-thumb{background:rgba(0,168,107,0.12);border-radius:4px}
.sidebar-brand{padding:22px 20px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(0,168,107,0.04) 0%,transparent 100%);position:relative}
.sidebar-brand::after{content:'';position:absolute;bottom:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,168,107,0.12),transparent)}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#0D7A4A,#00A86B);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:14px;color:#fff;box-shadow:0 3px 16px rgba(0,168,107,0.3)}
.brand-info h1{font-size:15px;color:#fff;line-height:1.2}
.brand-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.role-badge{display:inline-flex;align-items:center;gap:5px;margin-top:12px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.role-badge.admin{background:rgba(0,168,107,0.12);color:var(--teal);border:1px solid rgba(0,168,107,0.15)}
.role-badge.staff{background:rgba(255,179,64,0.1);color:var(--amber);border:1px solid rgba(255,179,64,0.15)}
.role-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-section{margin-bottom:6px}
.nav-section-label{display:flex;align-items:center;gap:7px;padding:6px 12px 8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--text-dim)}
.accent-line{flex:1;height:1px;background:var(--border)}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);color:var(--text-secondary);background:transparent;border:none;width:100%;text-align:left;font-size:13px;font-weight:500;transition:all .2s ease;position:relative;overflow:hidden}
.nav-item:hover{background:rgba(0,168,107,0.05);color:var(--text);transform:translateX(2px)}
.nav-item.active{background:rgba(0,168,107,0.1);color:var(--teal);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--teal);box-shadow:0 0 12px rgba(0,168,107,0.45)}
.nav-item .icon{width:18px;height:18px;flex-shrink:0;opacity:.7}
.nav-item.active .icon{opacity:1}
.sidebar-ecg{margin:8px 18px 6px;height:20px}.sidebar-ecg svg{width:100%;height:100%}
.ecg-base{fill:none;stroke:rgba(0,168,107,0.08);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ecg-glow{fill:none;stroke:var(--teal);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30 250;animation:ecgRun 3s linear infinite;opacity:.7;filter:drop-shadow(0 0 5px rgba(0,168,107,0.45))}
@keyframes ecgRun{to{stroke-dashoffset:-280}}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);background:rgba(0,0,0,0.2)}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.03);margin-bottom:6px}
.user-avatar{width:30px;height:30px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.user-pill .user-name{font-size:12.5px;font-weight:600;color:var(--text)}
.user-pill .user-role{font-size:10.5px;color:var(--text-muted)}
.logout-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--danger);background:transparent;border:none;width:100%;text-align:left;font-size:13px;font-weight:500;transition:all .2s ease}
.logout-btn:hover{background:var(--danger-light)}

/* MAIN */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:var(--topbar-h);background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.topbar-left{display:flex;align-items:center;gap:12px}
#menu-btn{display:none;width:36px;height:36px;padding:0;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);align-items:center;justify-content:center;transition:all .2s ease}
#menu-btn:hover{background:var(--surface-3)}
.topbar-title h2{font-size:16px;color:#fff;font-weight:700}
.topbar-title p{margin:1px 0 0;font-size:12px;color:var(--text-muted);font-weight:400}
.topbar-right{display:flex;align-items:center;gap:14px}
.status-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:500;color:var(--text-muted);background:rgba(0,168,107,0.04);border:1px solid rgba(0,168,107,0.08)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:statusPulse 2s ease-in-out infinite;box-shadow:0 0 8px rgba(0,168,107,0.5)}
@keyframes statusPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.clock{font-size:12px;color:var(--text-muted);font-weight:500;font-variant-numeric:tabular-nums}
.bell-btn{position:relative;width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;transition:all .25s ease}
.bell-btn:hover{background:var(--surface-3);color:var(--teal)}
.bell-btn svg{width:18px;height:18px}
.bell-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(255,107,107,0.5)}
.notif-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:340px;max-height:400px;overflow-y:auto;background:rgba(0,0,0,0.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);display:none;z-index:30}
.notif-dropdown.open{display:block;animation:ddIn .2s ease both}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.notif-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.notif-header h4{font-size:14px;color:#fff}
.notif-header button{font-size:12px;color:var(--teal);background:none;border:none;font-weight:500}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border-subtle);font-size:13px;color:var(--text-secondary);transition:background .15s}
.notif-item:hover{background:rgba(0,168,107,0.03)}
.notif-time{font-size:11px;color:var(--text-dim);margin-top:3px}
.notif-empty{padding:30px 16px;text-align:center;color:var(--text-muted);font-size:13px}

/* CONTENT */
#content{padding:28px 28px 60px;overflow-y:auto;flex:1}

/* CARDS & GRIDS */
.grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:rgba(255,255,255,0.025);border:1px solid var(--border);border-radius:var(--radius);padding:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .25s ease;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,168,107,0.06),transparent);opacity:0;transition:opacity .25s ease}
.card:hover::before{opacity:1}.card:hover{border-color:rgba(0,168,107,0.12)}
.stat-card{padding:22px;background:linear-gradient(135deg,rgba(255,255,255,0.03),rgba(0,168,107,0.03));border:1px solid var(--border);border-radius:var(--radius);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:-50%;right:-30%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(0,168,107,0.08),transparent 70%);pointer-events:none}
.stat-icon{width:40px;height:40px;border-radius:10px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;background:rgba(0,168,107,0.1)}
.stat-icon svg{width:20px;height:20px;color:var(--teal)}
.stat-label{font-size:12.5px;color:var(--text-muted);font-weight:500;margin-bottom:6px}
.stat-value{font-family:var(--font-display);font-size:30px;font-weight:800;color:#fff;line-height:1;letter-spacing:-.03em}
.stat-trend{display:flex;align-items:center;gap:4px;font-size:12px;margin-top:8px;font-weight:500}
.stat-trend.up{color:var(--teal)}.stat-trend.down{color:var(--danger)}.stat-trend.neutral{color:var(--text-muted)}
.mini-chart{display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:12px}
.mini-bar{width:4px;border-radius:2px;background:rgba(0,168,107,0.3);transition:height .4s ease}
.mini-bar:last-child{background:var(--teal)}
.section{margin-top:28px}.section:first-child{margin-top:0}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h3{font-size:16px;color:#fff}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);font-size:13px;font-weight:500;transition:all .2s ease;white-space:nowrap}
.btn:hover{background:var(--surface-3);border-color:rgba(255,255,255,0.1);color:var(--text)}
.btn-primary{background:linear-gradient(135deg,#0D7A4A,#00A86B);border-color:#0D7A4A;color:#fff;box-shadow:0 2px 16px rgba(0,168,107,0.25)}
.btn-primary:hover{box-shadow:0 4px 24px rgba(0,168,107,0.35);transform:translateY(-1px);color:#fff}
.btn-primary:active{transform:translateY(0)}
.btn-danger{background:var(--danger-light);border-color:rgba(255,107,107,0.15);color:var(--danger)}
.btn-danger:hover{background:rgba(255,107,107,0.15)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)}

/* TABLE */
.table-wrap{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table-wrap table{width:100%;border-collapse:collapse;border:none}
thead th{background:rgba(0,168,107,0.04);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:12px 16px;font-weight:600;border-bottom:1px solid var(--border)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border-subtle);font-size:13.5px;vertical-align:middle}
tbody tr{transition:background .15s}tbody tr:hover{background:rgba(0,168,107,0.025)}
tbody tr:last-child td{border-bottom:none}
.actions-cell{display:flex;gap:6px}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.01em}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.pending{background:var(--amber-light);color:var(--amber)}
.badge.confirmed{background:var(--ok-light);color:var(--teal)}
.badge.completed{background:rgba(255,255,255,0.05);color:var(--text-muted)}
.badge.cancelled{background:var(--danger-light);color:var(--danger)}
.badge.available{background:var(--ok-light);color:var(--teal)}
.badge.busy{background:var(--amber-light);color:var(--amber)}
.badge.leave{background:var(--danger-light);color:var(--danger)}
.badge.in-progress{background:var(--blue-light);color:var(--blue)}

/* FORMS / MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{background:rgba(0,0,0,0.97);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;width:440px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 40px 80px rgba(0,0,0,0.6);position:relative}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,168,107,0.15),transparent)}
.modal h3{font-size:17px;margin-bottom:18px;color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.07);border-radius:var(--radius-sm);background:rgba(255,255,255,0.03);color:var(--text);transition:all .25s ease}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(0,168,107,0.08);background:rgba(255,255,255,0.04)}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,0.18)}
.field textarea{resize:vertical;min-height:70px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* TOOLBAR */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.toolbar-search{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);transition:all .25s ease;width:260px}
.toolbar-search:focus-within{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(0,168,107,0.08)}
.toolbar-search svg{width:16px;height:16px;color:var(--text-muted);flex-shrink:0}
.toolbar-search input{border:none;background:none;color:var(--text);width:100%;outline:none;font-size:13px}
.toolbar-search input::placeholder{color:var(--text-dim)}
.toolbar select{padding:9px 12px;border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);background:rgba(255,255,255,0.03);color:var(--text);font-size:13px}

/* EMPTY STATE */
.empty-state{padding:50px 24px;text-align:center}
.empty-icon{width:64px;height:64px;border-radius:16px;margin:0 auto 16px;background:rgba(0,168,107,0.06);display:flex;align-items:center;justify-content:center}
.empty-icon svg{width:28px;height:28px;color:var(--text-dim)}
.empty-state h4{font-size:15px;color:var(--text-secondary);margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--text-muted);max-width:300px;margin:0 auto}

/* QUEUE */
.queue-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:rgba(255,255,255,0.02);margin-bottom:8px;transition:all .25s ease}
.queue-item:hover{border-color:rgba(0,168,107,0.2);background:rgba(0,168,107,0.03)}
.queue-num{width:36px;height:36px;border-radius:10px;flex-shrink:0;background:rgba(0,168,107,0.1);color:var(--teal);font-family:var(--font-display);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.q-info{flex:1;min-width:0}.q-name{font-weight:600;color:#fff;font-size:13.5px}.q-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.queue-actions{display:flex;gap:6px}

/* BRAND PREVIEW */
.brand-preview{display:flex;align-items:center;gap:16px;padding:18px;border:1px dashed rgba(0,168,107,0.2);border-radius:var(--radius);background:rgba(0,168,107,0.03);margin-bottom:20px}
.brand-swatch{width:48px;height:48px;border-radius:12px;flex-shrink:0}

/* BAR CHART */
.bar-chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#00A86B,#0D7A4A);transition:height .5s cubic-bezier(.22,1,.36,1);box-shadow:0 0 10px rgba(0,168,107,0.2)}
.bar-value{font-size:11px;color:var(--text-secondary);font-weight:600}
.bar-label{font-size:11px;color:var(--text-dim)}

/* DONUT */
.donut-wrap{display:flex;align-items:center;gap:28px}
.donut{position:relative;width:140px;height:140px;flex-shrink:0}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-val{font-family:var(--font-display);font-size:24px;font-weight:800;color:#fff;line-height:1}
.donut-lbl{font-size:11px;color:var(--text-muted);margin-top:2px}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* TOGGLE ROW */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border-subtle)}
.toggle-row:last-child{border-bottom:none}
.toggle-name{font-weight:600;color:#fff;font-size:13.5px}
.toggle-sub{font-size:12px;color:var(--text-muted);margin-top:2px}

/* TOAST */
#toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{display:flex;align-items:center;gap:10px;padding:13px 18px;border-radius:var(--radius);background:rgba(0,0,0,0.95);backdrop-filter:blur(16px);border:1px solid var(--border);color:#fff;font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,0.5);animation:toastIn .25s cubic-bezier(.22,1,.36,1) both}
.toast-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700}
.toast-icon.ok{background:var(--ok-light);color:var(--teal)}.toast-icon.err{background:var(--danger-light);color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.95)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px)}}
.toast-exit{animation:toastOut .2s ease-in forwards}

/* SKELETON */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,rgba(255,255,255,0.03) 50%,var(--surface-2) 75%);background-size:800px 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:6px}

/* ANIMATIONS */
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.view-enter{animation:fadeInUp .3s cubic-bezier(.22,1,.36,1) both}
.card-stagger{animation:fadeInUp .25s cubic-bezier(.22,1,.36,1) both}
.hint{font-size:12px;color:var(--text-muted);margin-top:10px}

/* RESPONSIVE */
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){#sidebar{position:fixed;left:0;top:0;z-index:40;margin-left:calc(-1 * var(--sidebar-w));box-shadow:0 0 0 9999px rgba(0,0,0,0)}#sidebar.open{margin-left:0;box-shadow:0 0 60px rgba(0,0,0,.6)}#content{padding:20px 16px 60px}.grid-4,.grid-3{grid-template-columns:1fr 1fr}#menu-btn{display:flex !important}.status-pill{display:none}}
@media(max-width:520px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.toolbar-search{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
/* ═══ AUTH ═══ */
(function(){var a=sessionStorage.getItem('hospital_auth');if(!a){window.location.href='index.html';return}try{var p=JSON.parse(a);if(!p.loggedIn||(p.role!=='admin'&&p.role!=='staff'))window.location.href='index.html'}catch(e){window.location.href='index.html'}})();
var currentUser=null,currentRole=null;
(function(){try{var a=JSON.parse(sessionStorage.getItem('hospital_auth'));currentUser=a.user;currentRole=a.role}catch(e){window.location.href='index.html'}})();
window.logout=function(){sessionStorage.removeItem('hospital_auth');window.location.href='index.html'};

/* ═══ STORAGE (PostgreSQL-backed API) ═══ */
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9)}
function defaultData(){return{profile:{name:'SehatConnectAI Hospital',address:'Plot 14, Shahrah-e-Faisal, Karachi',phone:'+92 21 111 222 333',hours:'8:00 AM - 10:00 PM',email:'info@sehatconnectai.pk',website:'sehatconnectai.pk',emergency:'+92 21 111 222 000',reception:'+92 21 111 222 333',description:'Premier healthcare facility providing world-class medical services.',facilities:'Emergency, ICU, Operation Theater, Lab, Pharmacy, Radiology',services:'Cardiology, Orthopedics, Pediatrics, Neurology, General Surgery'},branding:{primary:'#00D4AA',secondary:'#00B894',logoText:'SC'},departments:[{id:uid('dep'),name:'Cardiology',description:'Heart & vascular care',head:'Dr. Ayesha Khan'},{id:uid('dep'),name:'Orthopedics',description:'Bone & joint care',head:'Dr. Bilal Ahmed'},{id:uid('dep'),name:'Pediatrics',description:'Child healthcare',head:'Dr. Sana Rizvi'}],doctors:[],staff:[],patients:[],appointments:[],queue:[],notifications:[]}}
var state=null,lastSnapshot='',currentView='admin-dashboard';
async function loadState(){try{var r=await fetch('/api/state');if(!r.ok)throw new Error('bad response');state=await r.json();if(!state||!state.departments)state=defaultData()}catch(e){state=defaultData();await saveState(true)}seedIfEmpty()}
async function saveState(s){try{var r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(!r.ok)throw new Error('bad response');lastSnapshot=JSON.stringify(state)}catch(e){if(!s)toast('Could not save changes.',true)}}
function seedIfEmpty(){
if(state.doctors.length===0){var d1=state.departments[0].id,d2=state.departments[1].id,d3=state.departments[2].id;state.doctors.push({id:uid('doc'),name:'Dr. Ayesha Khan',specialization:'Cardiologist',departmentId:d1,phone:'0300-1112233',photoInitials:'AK',availability:'available',schedule:{}},{id:uid('doc'),name:'Dr. Bilal Ahmed',specialization:'Orthopedic Surgeon',departmentId:d2,phone:'0300-2223344',photoInitials:'BA',availability:'busy',schedule:{}},{id:uid('doc'),name:'Dr. Sana Rizvi',specialization:'Pediatrician',departmentId:d3,phone:'0300-3334455',photoInitials:'SR',availability:'leave',schedule:{}})}
if(state.staff.length===0)state.staff.push({id:uid('stf'),name:'Mubashir Javaid',role:'Front Desk Coordinator',departmentId:state.departments[0].id,shift:'Morning (8am-4pm)',phone:'0301-9998877'},{id:uid('stf'),name:'Hina Malik',role:'Nurse',departmentId:state.departments[1].id,shift:'Evening (4pm-12am)',phone:'0301-8887766'});
if(state.patients.length===0)state.patients.push({id:uid('pat'),name:'Ahmed Raza',phone:'0333-1234567',age:34},{id:uid('pat'),name:'Fatima Noor',phone:'0333-7654321',age:27});
if(state.appointments.length===0){var t=new Date().toISOString().slice(0,10);state.appointments.push({id:uid('apt'),patientName:'Ahmed Raza',doctorId:state.doctors[0].id,departmentId:state.departments[0].id,date:t,time:'10:30',status:'confirmed'},{id:uid('apt'),patientName:'Fatima Noor',doctorId:state.doctors[2].id,departmentId:state.departments[2].id,date:t,time:'12:00',status:'pending'})}
}

/* ═══ 12H TIME ═══ */
function to12h(t){if(!t)return'—';var s=t.trim();if(s.match(/AM|PM|am|pm/i))return s;var p=s.split(':');if(p.length<2)return s;var h=parseInt(p[0],10),m=p[1];if(isNaN(h))return s;return(h%12||12)+':'+m+(h>=12?' PM':' AM')}

/* ═══ UTILITIES ═══ */
function esc(s){return(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtDate(d){return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function docName(id){var d=state.doctors.find(function(x){return x.id===id});return d?d.name:'—'}
function depName(id){var d=state.departments.find(function(x){return x.id===id});return d?d.name:'—'}
function todayStr(){return new Date().toISOString().slice(0,10)}
function getGreeting(){var h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function toast(msg,err){var w=document.getElementById('toast-wrap'),t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon '+(err?'err':'ok')+'">'+(err?'!':'✓')+'</span>'+esc(msg);w.appendChild(t);setTimeout(function(){t.classList.add('toast-exit');setTimeout(function(){if(t.parentNode)t.remove()},250)},3000)}

/* ═══ ANIM ═══ */
var anim={reduced:window.matchMedia('(prefers-reduced-motion:reduce)').matches,
staggerIn:function(p,sel,opts){if(this.reduced)return;var s=(opts&&opts.stagger)||40,d=(opts&&opts.duration)||250,els=p.querySelectorAll(sel);els.forEach(function(el,i){el.style.opacity='0';el.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:d,delay:i*s,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'})})},
countUp:function(el,target){if(this.reduced){el.textContent=target.toLocaleString();return}var start=performance.now();(function step(now){var p=Math.min((now-start)/900,1);el.textContent=Math.round((1-Math.pow(1-p,3))*target).toLocaleString();if(p<1)requestAnimationFrame(step)})(start)},
shake:function(el){if(this.reduced)return;el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:350,easing:'ease-out'})},
pulse:function(el){if(this.reduced)return;el.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:250,easing:'ease-out'})}};

/* ═══ MODAL ═══ */
function openModal(html){var o=document.getElementById('overlay'),m=document.getElementById('modalBody');m.innerHTML=html;o.classList.add('open');if(!anim.reduced)m.animate([{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'scale(1)'}],{duration:220,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'})}
function closeModal(){var o=document.getElementById('overlay'),m=document.getElementById('modalBody');if(!anim.reduced){m.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.96)'}],{duration:150,easing:'ease-in',fill:'forwards'}).finished.then(function(){o.classList.remove('open');m.innerHTML=''})}else{o.classList.remove('open');m.innerHTML=''}}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target.id==='overlay')closeModal()});

/* ═══ NAV ═══ */
var VIEW_META={'admin-dashboard':{title:'Admin Dashboard',sub:'Overview of hospital operations'},'admin-profile':{title:'Hospital Profile',sub:'Manage hospital identity and contact info'},'admin-branding':{title:'Branding',sub:'Customize your visual identity'},'admin-departments':{title:'Departments',sub:'Manage hospital departments'},'admin-doctors':{title:'Doctors',sub:'Manage doctor profiles'},'admin-schedules':{title:'Schedules',sub:'Set weekly doctor schedules'},'admin-availability':{title:'Availability',sub:'Manage doctor availability status'},'admin-appointments':{title:'Appointment Management',sub:'Review and manage all appointments'},'admin-staff':{title:'Staff Management',sub:'Manage staff members and roles'},'admin-analytics':{title:'Analytics',sub:'Hospital performance at a glance'},'staff-dashboard':{title:'Staff Dashboard',sub:"Today's operational snapshot"},'staff-today':{title:"Today's Appointments",sub:'All appointments scheduled for today'},'staff-checkin':{title:'Patient Check-in',sub:'Check in patients and add walk-ins'},'staff-queue':{title:'Queue Management',sub:'Live patient queue'},'staff-availability':{title:'Doctor Availability',sub:'Read-only view of doctor status'},'staff-profile':{title:'Profile & Notifications',sub:'Your profile and recent alerts'}};
document.querySelectorAll('.nav-item[data-view]').forEach(function(btn){btn.addEventListener('click',function(){var view=btn.dataset.view;if(!view)return;if(currentRole==='staff'&&view.startsWith('admin-')){toast('Access denied.',true);return}currentView=view;document.querySelectorAll('.nav-item').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');document.getElementById('sidebar').classList.remove('open');render()})});

async function persistAndRender(msg){await saveState();if(msg)toast(msg);render()}

/* ═══ WEEK BAR CHART ═══ */
function weekBarChartInner(){var days=[];for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-6+i);days.push(d.toISOString().slice(0,10))}var counts=days.map(function(d){return state.appointments.filter(function(a){return a.date===d}).length});var mx=Math.max.apply(null,[1].concat(counts));return days.map(function(d,i){return '<div class="bar-col"><div class="bar-value">'+counts[i]+'</div><div class="bar" data-target="'+Math.max(6,(counts[i]/mx)*130)+'" style="height:6px"></div><div class="bar-label">'+new Date(d).toLocaleDateString('en-GB',{weekday:'short'})+'</div></div>'}).join('')}

/* ═══ RENDER ROUTER ═══ */
function render(){
if(currentRole==='staff'&&currentView.startsWith('admin-')){currentView='staff-dashboard';document.querySelectorAll('.nav-item').forEach(function(b){b.classList.remove('active')});var sb=document.querySelector('.nav-item[data-view="staff-dashboard"]');if(sb)sb.classList.add('active');toast('Redirected.',true)}
var meta=VIEW_META[currentView];if(!meta)meta={title:'Not Found',sub:''};
document.getElementById('viewTitle').textContent=meta.title;document.getElementById('viewSub').textContent=meta.sub;
document.getElementById('hospitalNameDisplay').textContent=state.profile.name;
document.getElementById('notifCount').textContent=state.notifications.length;
var c=document.getElementById('content');
var R={'admin-dashboard':renderAdminDashboard,'admin-profile':renderAdminProfile,'admin-branding':renderAdminBranding,'admin-departments':renderAdminDepartments,'admin-doctors':renderAdminDoctors,'admin-schedules':renderAdminSchedules,'admin-availability':renderAdminAvailability,'admin-appointments':renderAdminAppointments,'admin-staff':renderAdminStaff,'admin-analytics':renderAdminAnalytics,'staff-dashboard':renderStaffDashboard,'staff-today':renderStaffToday,'staff-checkin':renderStaffCheckin,'staff-queue':renderStaffQueue,'staff-availability':renderStaffAvailability,'staff-profile':renderStaffProfile};
c.innerHTML=R[currentView]?R[currentView]():'<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div><h4>View Not Found</h4></div>';
var ve=c.firstElementChild;if(ve)ve.classList.add('view-enter');
wireDynamicHandlers();
requestAnimationFrame(function(){anim.staggerIn(c,'.stat-card',{stagger:45,duration:220});anim.staggerIn(c,'.card:not(.stat-card)',{stagger:40,duration:220});anim.staggerIn(c,'tbody tr',{stagger:35,duration:180});anim.staggerIn(c,'.queue-item',{stagger:45,duration:220});c.querySelectorAll('.bar[data-target]').forEach(function(bar){requestAnimationFrame(function(){bar.style.height=bar.dataset.target+'px'})});c.querySelectorAll('.stat-card .stat-value').forEach(function(el){var target=parseInt(el.textContent.replace(/,/g,''),10);if(!isNaN(target)&&target>0)anim.countUp(el,target)})});
}

/* ═══ ADMIN DASHBOARD ═══ */
function renderAdminDashboard(){
var today=todayStr(),todays=state.appointments.filter(function(a){return a.date===today});
var booked=state.appointments.filter(function(a){return a.status==='confirmed'}).length;
var completed=state.appointments.filter(function(a){return a.status==='completed'}).length;
var cancelled=state.appointments.filter(function(a){return a.status==='cancelled'}).length;
var pending=state.appointments.filter(function(a){return a.status==='pending'}).length;

/* ═══ ADMIN ANALYTICS ═══ */
function renderAdminAnalytics(){var byDept=state.departments.map(function(d){return{name:d.name,count:state.appointments.filter(function(a){return a.departmentId===d.id}).length}});var maxDept=Math.max.apply(null,[1].concat(byDept.map(function(x){return x.count})));var byStatus=['pending','confirmed','completed','cancelled'].map(function(st){return{name:st,count:state.appointments.filter(function(a){return a.status===st}).length}});var maxStatus=Math.max.apply(null,[1].concat(byStatus.map(function(x){return x.count})));var total=state.appointments.length||1;var compRate=Math.round((state.appointments.filter(function(a){return a.status==='completed'}).length/total)*100);var cancRate=Math.round((state.appointments.filter(function(a){return a.status==='cancelled'}).length/total)*100);
var colors={pending:'var(--amber)',confirmed:'var(--teal)',completed:'var(--ok)',cancelled:'var(--danger)'};
return '<div class="grid grid-4" style="margin-bottom:20px"><div class="stat-card"><div class="stat-label">Total Appointments</div><div class="stat-value">'+total+'</div></div><div class="stat-card"><div class="stat-label">Completion Rate</div><div class="stat-value" style="color:var(--teal)">'+compRate+'%</div></div><div class="stat-card"><div class="stat-label">Cancellation Rate</div><div class="stat-value" style="color:var(--danger)">'+cancRate+'%</div></div><div class="stat-card"><div class="stat-label">Active Doctors</div><div class="stat-value">'+state.doctors.filter(function(d){return d.availability==='available'}).length+'</div></div></div>'
+'<div class="grid grid-2" style="margin-bottom:20px"><div class="card"><h4 style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">Appointments by Department</h4><div class="bar-chart">'+byDept.map(function(x){return '<div class="bar-col"><div class="bar-value">'+x.count+'</div><div class="bar" data-target="'+Math.max(6,(x.count/maxDept)*130)+'" style="height:6px"></div><div class="bar-label">'+esc(x.name).slice(0,10)+'</div></div>'}).join('')+'</div></div>'
+'<div class="card"><h4 style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">Appointments by Status</h4><div class="bar-chart">'+byStatus.map(function(x){return '<div class="bar-col"><div class="bar-value">'+x.count+'</div><div class="bar" data-target="'+Math.max(6,(x.count/maxStatus)*130)+'" style="height:6px;background:'+colors[x.name]+'"></div><div class="bar-label">'+x.name+'</div></div>'}).join('')+'</div></div></div>'
+'<div class="card"><h4 style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">Weekly Trend</h4><div class="bar-chart">'+weekBarChartInner()+'</div></div>';}

/* ═══ STAFF CHECK-IN ═══ */
function renderStaffCheckin(){var pOpts=state.patients.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+' — '+esc(p.phone)+'</option>'}).join('');var dOpts=state.doctors.map(function(d){return '<option value="'+d.id+'">'+esc(d.name)+'</option>'}).join('');

async function checkInExisting(){var patId=document.getElementById('ci_patient').value,docId=document.getElementById('ci_doctor').value;var pat=state.patients.find(function(p){return p.id===patId});if(!pat){toast('Select a patient first.',true);return}addToQueue(pat.name,docId);await persistAndRender('Patient checked in')}

function addToQueue(patientName,doctorId){var num=state.queue.filter(function(q){return q.status!=='done'}).length+1;state.queue.push({id:uid('q'),num:num,patientName:patientName,doctorId:doctorId,status:'waiting',addedAt:Date.now()})}

/* ═══ STAFF QUEUE ═══ */
function renderQueueList(list,showAll){if(list.length===0)return '<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg></div><h4>Queue is Empty</h4><p>Checked-in patients will appear here.</p></div>';
return list.map(function(q,i){var waitMin=Math.max(0,Math.round((Date.now()-q.addedAt)/60000));var sb=q.status==='waiting'?'pending':q.status==='in-progress'?'confirmed':'completed';
return '<div class="queue-item" data-queue-id="'+q.id+'"><div class="queue-num">'+(i+1)+'</div><div class="q-info"><div class="q-name">'+esc(q.patientName)+'</div><div class="q-meta">'+esc(docName(q.doctorId))+' &middot; waiting '+waitMin+' min &middot; <span class="badge '+sb+'">'+q.status+'</span></div></div><div class="queue-actions">'+(i>0?'<button class="btn btn-sm" onclick="moveQueue(\''+q.id+'\',-1)" title="Move up">↑</button>':'')+'<button class="btn btn-sm" onclick="moveQueue(\''+q.id+'\',1)" title="Move down">↓</button>'+(q.status!=='in-progress'?'<button class="btn btn-sm" onclick="setQueueStatus(\''+q.id+'\',\'in-progress\')">Start</button>':'')+'<button class="btn btn-sm btn-primary" onclick="setQueueStatus(\''+q.id+'\',\'done\')">Done</button></div></div>'}).join('')}
function renderStaffQueue(){var active=state.queue.filter(function(q){return q.status!=='done'});return renderQueueList(active,true)}
async function moveQueue(id,dir){var active=state.queue.filter(function(q){return q.status!=='done'});var idx=active.findIndex(function(q){return q.id===id});var swap=idx+dir;if(swap<0||swap>=active.length)return;var realA=state.queue.findIndex(function(q){return q.id===active[idx].id});var realB=state.queue.findIndex(function(q){return q.id===active[swap].id});var tmp=state.queue[realA];state.queue[realA]=state.queue[realB];state.queue[realB]=tmp;await persistAndRender()}
async function setQueueStatus(id,status){var q=state.queue.find(function(x){return x.id===id});q.status=status;await persistAndRender(status==='done'?'Patient marked done':'Queue updated')}

/* ═══ STAFF AVAILABILITY ═══ */
function renderStaffAvailability(){if(state.doctors.length===0)return '<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div><h4>No Doctors</h4><p>No doctors added yet.</p></div>';
var rows=state.doctors.map(function(d){return '<div class="toggle-row"><div style="display:flex;align-items:center;gap:12px"><span style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">'+esc(d.photoInitials||'DR')+'</span><div><div class="toggle-name">'+esc(d.name)+'</div><div class="toggle-sub">'+esc(depName(d.departmentId))+' &middot; '+esc(d.specialization)+'</div></div></div><span class="badge '+d.availability+'">'+d.availability+'</span></div>'}).join('');
return '<div class="card">'+rows+'</div><div class="hint" style="margin-top:10px">Read-only — availability is managed by Admin.</div>';}

/* ═══ STAFF PROFILE ═══ */
function renderStaffProfile(){var me=state.staff.find(function(s){return s.name.toLowerCase().indexOf(currentUser.toLowerCase())>-1})||state.staff[0]||{name:'',role:'',phone:'',shift:''};var notifs=state.notifications.slice(0,10).map(function(n){return '<div style="padding:12px 0;border-bottom:1px solid var(--border-subtle);font-size:13px">'+esc(n.text)+'<div class="notif-time">'+new Date(n.time).toLocaleString()+'</div></div>'}).join('');
return '<div class="grid grid-2"><div class="card"><h4 style="font-size:15px;color:#fff;margin-bottom:18px">My Profile</h4><div class="field"><label>Name</label><input id="sp_name" value="'+esc(me.name)+'"></div><div class="field"><label>Role</label><input id="sp_role" value="'+esc(me.role)+'"></div><div class="field"><label>Shift</label><input id="sp_shift" value="'+esc(me.shift)+'"></div><div class="field"><label>Phone</label><input id="sp_phone" value="'+esc(me.phone)+'"></div><button class="btn btn-primary" onclick="saveStaffProfile()" style="padding:12px 28px">Save Profile</button></div>'
+'<div class="card"><h4 style="font-size:15px;color:#fff;margin-bottom:14px">Notifications</h4>'+(notifs||'<div class="notif-empty">No notifications yet.</div>')+'</div></div>';}
async function saveStaffProfile(){var me=state.staff.find(function(s){return s.name.toLowerCase().indexOf(currentUser.toLowerCase())>-1})||state.staff[0];if(!me){me={id:uid('stf')};state.staff.push(me)}me.name=document.getElementById('sp_name').value.trim();me.role=document.getElementById('sp_role').value.trim();me.shift=document.getElementById('sp_shift').value.trim();me.phone=document.getElementById('sp_phone').value.trim();await persistAndRender('Profile updated')}

/* ═══ SHARED HELPERS ═══ */
function filterTable(input,tableId){var q=input.value.toLowerCase();document.querySelectorAll('#'+tableId+' tbody tr').forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q)>-1?'':'none'})}
function wireDynamicHandlers(){
var mb=document.getElementById('menu-btn');if(mb&&!mb._bound){mb._bound=true;mb.addEventListener('click',function(){var sb=document.getElementById('sidebar');sb.classList.toggle('open');if(sb.classList.contains('open')){var ov=document.getElementById('sidebar-overlay');if(!ov){ov=document.createElement('div');ov.id='sidebar-overlay';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:29';ov.addEventListener('click',function(){sb.classList.remove('open');ov.remove()});document.body.appendChild(ov)}}else{var ov2=document.getElementById('sidebar-overlay');if(ov2)ov2.remove()}})}}

/* Notifications dropdown */
document.getElementById('bellBtn').addEventListener('click',function(){var dd=document.getElementById('notifDropdown');if(dd.classList.contains('open')){dd.classList.remove('open');return}var notifs=state.notifications.slice(0,10);var html='<div class="notif-header"><h4>Notifications</h4><button onclick="markAllRead()">Mark all read</button></div>';if(notifs.length===0){html+='<div class="notif-empty">No notifications yet.</div>'}else{html+=notifs.map(function(n){return '<div class="notif-item">'+esc(n.text)+'<div class="notif-time">'+new Date(n.time).toLocaleString()+'</div></div>'}).join('')}dd.innerHTML=html;dd.classList.add('open')});
function markAllRead(){state.notifications=[];document.getElementById('notifCount').textContent='0';document.getElementById('notifDropdown').classList.remove('open')}
document.addEventListener('click',function(e){var dd=document.getElementById('notifDropdown'),btn=document.getElementById('bellBtn');if(!dd.contains(e.target)&&!btn.contains(e.target))dd.classList.remove('open')});

/* Clock */
function tickClock(){document.getElementById('clock').textContent=new Date().toLocaleString('en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
setInterval(tickClock,1000);

/* Real-time sync */
async function pollSync(){try{var r=await fetch('/api/state');if(!r.ok)return;var text=await r.text();if(text&&text!==lastSnapshot){state=JSON.parse(text);lastSnapshot=text;render()}}catch(e){}}
setInterval(pollSync,4000);

/* ═══ BOOT ═══ */
(async function boot(){await loadState();lastSnapshot=JSON.stringify(state);
var adminNav=document.getElementById('admin-nav'),staffNav=document.getElementById('staff-nav'),badge=document.getElementById('roleBadge'),userPill=document.querySelector('.user-pill');
if(currentRole==='admin'){adminNav.style.display='';staffNav.style.display='';badge.className='role-badge admin';badge.textContent='Admin';document.getElementById('userName').textContent=currentUser;document.getElementById('userRole').textContent='Administrator';document.getElementById('userAvatar').textContent=currentUser[0].toUpperCase();currentView='admin-dashboard'}
else{adminNav.style.display='none';staffNav.style.display='';badge.className='role-badge staff';badge.textContent='Staff';document.getElementById('userName').textContent=currentUser;document.getElementById('userRole').textContent='Staff Member';document.getElementById('userAvatar').textContent=currentUser[0].toUpperCase();currentView='staff-dashboard'}
document.querySelectorAll('.nav-item').forEach(function(b){b.classList.remove('active')});var ab=document.querySelector('.nav-item[data-view="'+currentView+'"]');if(ab)ab.classList.add('active');
tickClock();render()})();
</script>
</body>
</html>
