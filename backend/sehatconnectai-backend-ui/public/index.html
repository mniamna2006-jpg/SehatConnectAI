<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — SehatConnectAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000000;
  --surface:rgba(0,168,107,0.06);
  --surface-2:rgba(255,255,255,0.05);
  --surface-3:rgba(255,255,255,0.08);
  --teal:#00A86B;
  --teal-dark:#0D7A4A;
  --teal-deeper:#086B3E;
  --teal-glow:rgba(0,168,107,0.25);
  --text:#FFFFFF;
  --text-muted:#8A9A92;
  --border:rgba(0,168,107,0.12);
  --border-subtle:rgba(255,255,255,0.06);
  --danger:#FF6B6B;
  --radius:14px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-display:'Plus Jakarta Sans','Inter',sans-serif;
}
html{height:100%;}
body{
  font-family:var(--font);font-size:14px;color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:hidden;position:relative;
  background:var(--bg);
}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;font-size:14px;}

/* ===== AMBIENT BACKGROUND ===== */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;}
.ambient::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 60% at 15% 15%,rgba(0,168,107,0.08) 0%,transparent 55%),
    radial-gradient(ellipse 70% 50% at 85% 85%,rgba(0,100,70,0.12) 0%,transparent 50%),
    radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,168,107,0.03) 0%,transparent 60%);
}
.grid-lines{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(0,168,107,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,168,107,0.025) 1px,transparent 1px);
  background-size:80px 80px;
  mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,black,transparent);
  -webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,black,transparent);
}

.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}
.orb-1{width:500px;height:500px;background:rgba(0,168,107,0.06);top:-150px;left:-150px;animation:orbFloat1 18s ease-in-out infinite;}
.orb-2{width:400px;height:400px;background:rgba(0,80,60,0.15);bottom:-100px;right:-120px;animation:orbFloat2 22s ease-in-out infinite;}
.orb-3{width:250px;height:250px;background:rgba(0,168,107,0.04);top:60%;left:55%;animation:orbFloat3 14s ease-in-out infinite;}
@keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,30px) scale(1.08);}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,-40px) scale(1.05);}}
@keyframes orbFloat3{0%,100%{transform:translate(0,0);}50%{transform:translate(-20px,30px);}}

/* Pulse rings */
.pulse-ring{position:fixed;border-radius:50%;border:1px solid rgba(0,168,107,0.04);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0;}
.pulse-ring:nth-child(1){width:600px;height:600px;animation:pulseExpand 5s ease-in-out infinite;}
.pulse-ring:nth-child(2){width:800px;height:800px;animation:pulseExpand 5s ease-in-out infinite 1.2s;}
.pulse-ring:nth-child(3){width:1000px;height:1000px;animation:pulseExpand 5s ease-in-out infinite 2.4s;}
@keyframes pulseExpand{0%,100%{opacity:.15;transform:translate(-50%,-50%) scale(1);}50%{opacity:.35;transform:translate(-50%,-50%) scale(1.04);}}

/* ECG line */
.ecg-line{position:fixed;bottom:12%;left:0;width:100%;height:50px;z-index:0;pointer-events:none;opacity:.1;}
.ecg-line svg{width:100%;height:100%;}
.ecg-path{fill:none;stroke:var(--teal);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;animation:drawEcg 4s linear infinite;}
@keyframes drawEcg{to{stroke-dashoffset:-400;}}

/* ===== LOADING SCREEN ===== */
#loading-screen{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .5s ease,visibility .5s ease;
}
#loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.loader-logo{
  width:72px;height:72px;border-radius:20px;
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:24px;color:#fff;
  box-shadow:0 8px 40px rgba(0,168,107,0.25),0 0 80px rgba(0,168,107,0.1);
  animation:logoAppear .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes logoAppear{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.loader-name{
  font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text);
  margin-top:20px;letter-spacing:-.02em;
  animation:fadeIn .5s ease .3s both;
}
.loader-sub{font-size:13px;color:var(--text-muted);margin-top:6px;animation:fadeIn .5s ease .45s both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.loader-ecg{width:180px;height:40px;margin-top:24px;animation:fadeIn .5s ease .55s both;}
.loader-ecg svg{width:100%;height:100%;}
.loader-ecg-path{fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60 300;animation:loaderEcg 1.8s linear infinite;filter:drop-shadow(0 0 6px rgba(0,168,107,0.5));}
@keyframes loaderEcg{to{stroke-dashoffset:-360;}}
.loader-bar-wrap{width:180px;height:3px;background:rgba(255,255,255,0.06);border-radius:4px;margin-top:20px;overflow:hidden;animation:fadeIn .5s ease .6s both;}
.loader-bar{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-dark));border-radius:4px;width:0%;transition:width .15s ease;}

/* Particles */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.particle{position:absolute;width:2px;height:2px;background:var(--teal);border-radius:50%;opacity:0;animation:particleFloat linear infinite;}
@keyframes particleFloat{
  0%{opacity:0;transform:translateY(0) scale(0);}
  10%{opacity:.5;transform:scale(1);}
  90%{opacity:.3;}
  100%{opacity:0;transform:translateY(-100vh) scale(0.5);}
}

/* ===== LOGIN CARD ===== */
.login-wrap{
  position:relative;z-index:1;width:420px;max-width:100%;
  opacity:0;animation:cardReveal .7s cubic-bezier(.22,1,.36,1) 1s both;
}
@keyframes cardReveal{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.login-card{
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(32px) saturate(1.4);-webkit-backdrop-filter:blur(32px) saturate(1.4);
  border:1px solid rgba(0,168,107,0.15);
  border-radius:22px;padding:40px 36px 36px;
  box-shadow:0 40px 80px rgba(0,0,0,0.5),0 0 120px rgba(0,168,107,0.04),inset 0 1px 0 rgba(255,255,255,0.04);
  position:relative;overflow:hidden;
}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,168,107,0.2),transparent);
}
.login-card::after{
  content:'';position:absolute;top:-60%;left:-60%;width:200%;height:200%;
  background:radial-gradient(circle at 30% 30%,rgba(0,168,107,0.03),transparent 50%);
  pointer-events:none;
}

.brand-row{display:flex;align-items:center;gap:14px;margin-bottom:24px;position:relative;z-index:1;}
.brand-icon{
  width:48px;height:48px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#0D7A4A,#00A86B);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:17px;color:#fff;
  box-shadow:0 4px 20px rgba(0,168,107,0.3);
}
.brand-text h2{font-family:var(--font-display);font-size:20px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.2;}
.brand-text p{font-size:12.5px;color:var(--text-muted);margin-top:2px;}

/* Role toggle */
.role-toggle{
  display:flex;gap:3px;margin-bottom:22px;
  background:rgba(255,255,255,0.03);padding:4px;border-radius:12px;
  border:1px solid rgba(255,255,255,0.05);position:relative;z-index:1;
}
.role-toggle button{
  flex:1;border:none;padding:11px 0;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--text-muted);
  background:transparent;transition:all .25s ease;letter-spacing:.01em;
}
.role-toggle button.active{
  background:rgba(0,168,107,0.15);
  color:var(--teal);
  box-shadow:0 2px 12px rgba(0,168,107,0.15);
}
.role-toggle button:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.03);}

/* Fields */
.field{margin-bottom:16px;position:relative;z-index:1;}
.field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:7px;font-weight:500;letter-spacing:.01em;}
.field input{
  width:100%;padding:12px 16px;
  border:1px solid rgba(255,255,255,0.07);border-radius:11px;
  background:rgba(255,255,255,0.03);color:#fff;
  font-size:14px;transition:all .25s ease;
}
.field input::placeholder{color:rgba(255,255,255,0.2);}
.field input:focus{outline:none;border-color:rgba(0,168,107,0.5);box-shadow:0 0 0 3px rgba(0,168,107,0.1);background:rgba(255,255,255,0.04);}
.pass-wrap{position:relative;}
.pass-wrap input{padding-right:48px;}
.eye-btn{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border:none;background:none;
  color:var(--text-muted);border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.eye-btn:hover{color:var(--teal);background:rgba(0,168,107,0.06);}
.eye-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

.login-error{
  background:rgba(255,107,107,0.08);color:var(--danger);
  font-size:13px;padding:11px 14px;border-radius:10px;
  margin-bottom:16px;display:none;border:1px solid rgba(255,107,107,0.12);
  position:relative;z-index:1;
}
.login-error.show{display:flex;align-items:center;gap:8px;}

/* Submit button */
.submit-btn{
  width:100%;padding:13px 0;margin-top:4px;position:relative;z-index:1;
  background:linear-gradient(135deg,#0D7A4A,#00A86B);
  border:none;color:#fff;border-radius:12px;
  font-size:14.5px;font-weight:600;letter-spacing:.02em;
  box-shadow:0 4px 24px rgba(0,168,107,0.3);
  transition:all .25s ease;overflow:hidden;
}
.submit-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--teal-dark),var(--teal-deeper));
  opacity:0;transition:opacity .25s ease;
}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,168,107,0.35);}
.submit-btn:hover::before{opacity:1;}
.submit-btn:active{transform:translateY(0);box-shadow:0 2px 16px rgba(0,168,107,0.2);}
.submit-btn span{position:relative;z-index:1;}

/* Divider */
.divider{display:flex;align-items:center;gap:14px;margin:22px 0 18px;position:relative;z-index:1;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06);}
.divider span{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;font-weight:500;}

.hint{
  text-align:center;font-size:12px;color:var(--text-muted);
  line-height:1.8;opacity:.7;position:relative;z-index:1;
}
.mono{font-family:'SF Mono',SFMono-Regular,Consolas,monospace;color:var(--teal);font-size:11.5px;font-weight:500;}

.footer{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,0.15);z-index:1;letter-spacing:.02em;}

/* ===== REDUCED MOTION ===== */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>

<div class="ambient"></div>
<div class="grid-lines"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="pulse-ring"></div>
<div class="pulse-ring"></div>
<div class="pulse-ring"></div>
<div class="ecg-line">
  <svg viewBox="0 0 1200 50" preserveAspectRatio="none">
    <path class="ecg-path" d="M0,25 L250,25 L270,25 L285,8 L300,42 L315,25 L550,25 L570,25 L585,8 L600,42 L615,25 L850,25 L870,25 L885,8 L900,42 L915,25 L1200,25"/>
  </svg>
</div>
<div class="particles" id="particles"></div>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div class="loader-logo">SC</div>
  <div class="loader-name">SehatConnectAI</div>
  <div class="loader-sub">Hospital Management System</div>
  <div class="loader-ecg">
    <svg viewBox="0 0 180 40" preserveAspectRatio="none">
      <path class="loader-ecg-path" d="M0,20 L50,20 L60,20 L68,6 L76,34 L84,20 L130,20 L140,20 L148,6 L156,34 L164,20 L180,20"/>
    </svg>
  </div>
  <div class="loader-bar-wrap"><div class="loader-bar" id="loaderBar"></div></div>
</div>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap" style="display:none;">
  <div class="login-card">
    <div class="brand-row">
      <div class="brand-icon">SC</div>
      <div class="brand-text">
        <h2>SehatConnectAI</h2>
        <p>Secure Hospital Portal</p>
      </div>
    </div>

    <div class="role-toggle">
      <button type="button" class="active" data-role="admin" onclick="selectRole('admin')">Admin</button>
      <button type="button" data-role="staff" onclick="selectRole('staff')">Staff</button>
    </div>

    <div class="login-error" id="loginError"></div>

    <div class="field"><label>Username</label><input id="login_user" placeholder="Enter username" autocomplete="username"></div>
    <div class="field"><label>Password</label><div class="pass-wrap"><input id="login_pass" type="password" placeholder="Enter password" autocomplete="current-password"><button type="button" class="eye-btn" onclick="togglePass()" aria-label="Show/hide password"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>

    <button class="submit-btn" onclick="attemptLogin()"><span>Sign in as <strong id="loginRoleLabel">Admin</strong></span></button>

      </div>
</div>

<div class="footer">SehatConnectAI &copy; 2026 &mdash; Premium Healthcare Platform</div>

<script>
/* ===== PARTICLES ===== */
(function(){
  const c=document.getElementById('particles');
  for(let i=0;i<24;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.top=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*14)+'s';
    p.style.animationDelay=(Math.random()*10)+'s';
    p.style.width=p.style.height=(1+Math.random()*2)+'px';
    c.appendChild(p);
  }
})();

/* ===== LOADING SCREEN ===== */
(function(){
  const bar=document.getElementById('loaderBar');
  let pct=0;
  const iv=setInterval(()=>{
    pct+=Math.random()*18+8;
    if(pct>=100){pct=100;clearInterval(iv);}
    bar.style.width=pct+'%';
  },80);
  setTimeout(()=>{
    document.getElementById('loading-screen').classList.add('hidden');
    document.getElementById('loginWrap').style.display='';
  },1300);
})();

/* ===== AUTH CHECK ===== */
(function(){
  const auth=sessionStorage.getItem('hospital_auth');
  if(auth){
    try{
      const a=JSON.parse(auth);
      if(a.loggedIn&&(a.role==='admin'||a.role==='staff')){
        window.location.href='hospital-module.html?role='+encodeURIComponent(a.role)+'&user='+encodeURIComponent(a.user);
        return;
      }
    }catch(e){}
  }
})();

let loginRole='admin';

function selectRole(role){
  loginRole=role;
  document.querySelectorAll('.role-toggle button').forEach(b=>b.classList.toggle('active',b.dataset.role===role));
  document.getElementById('loginRoleLabel').textContent=role==='admin'?'Admin':'Staff';
  document.getElementById('loginError').classList.remove('show');
}
function togglePass(){
  const inp=document.getElementById('login_pass');
  const btn=inp.parentElement.querySelector('.eye-btn');
  if(inp.type==='password'){inp.type='text';btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';}
  else{inp.type='password';btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';}
}
async function attemptLogin(){
  const user=document.getElementById('login_user').value.trim();
  const pass=document.getElementById('login_pass').value;
  const err=document.getElementById('loginError');
  if(!user||!pass){err.textContent='Enter username and password.';err.classList.add('show');return;}
  const btn=document.querySelector('.submit-btn');btn.disabled=true;
  try{
    const res=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:user,password:pass,role:loginRole})
    });
    const data=await res.json();
    if(res.ok&&data.success){
      err.classList.remove('show');
      sessionStorage.setItem('hospital_auth',JSON.stringify({role:data.role,user:data.user,loggedIn:true}));
      window.location.href='hospital-module.html?role='+encodeURIComponent(data.role)+'&user='+encodeURIComponent(data.user);
      return;
    }
    throw new Error(data.error||'Invalid username or password.');
  }catch(e){
    err.textContent=e.message||'Login failed. Please try again.';err.classList.add('show');
    const card=document.querySelector('.login-card');
    card.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:350,easing:'ease-out'});
  }finally{
    btn.disabled=false;
  }
}
document.getElementById('login_user').addEventListener('keydown',e=>{if(e.key==='Enter')attemptLogin();});
document.getElementById('login_pass').addEventListener('keydown',e=>{if(e.key==='Enter')attemptLogin();});
</script>
</body>
</html>
