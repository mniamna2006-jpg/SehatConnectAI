<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Hospital Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D0C;
  --surface:#141715;
  --surface-2:#1B1F1D;
  --mint:#095045;
  --mint-dim:#1A8068;
  --mint-soft:rgba(9,80,69,0.10);
  --text:#EDEFEC;
  --text-muted:#8B9691;
  --border:#262B28;
  --danger:#FF8A7A;
  --danger-bg:rgba(255,138,122,0.10);
  --radius:14px;
  --shadow:0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
h2{font-family:'Fraunces',serif;font-weight:600;margin:0;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;font-size:14px;}

.login-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 32px 30px;width:380px;max-width:100%;box-shadow:var(--shadow);overflow:hidden;}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--mint),transparent);opacity:.5;}

.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--mint-soft);border:1px solid var(--mint-dim);color:var(--mint);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:17px;margin-bottom:18px;}
.login-card h2{font-size:21px;letter-spacing:-.01em;}
.sub{font-size:12.5px;color:var(--text-muted);margin:5px 0 24px;}

.role-toggle{display:flex;gap:6px;margin-bottom:18px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--border);}
.role-toggle button{flex:1;position:relative;border:none;background:none;padding:9px 0;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .15s ease;}
.role-toggle button::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5;}
.role-toggle button.active{background:var(--mint-soft);color:var(--mint);border:1px solid var(--mint-dim);}
.role-toggle button.active::before{opacity:1;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase;}
.field input{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);}
.field input::placeholder{color:#54615B;}
.field input:focus{outline:none;border-color:var(--mint-dim);box-shadow:0 0 0 3px var(--mint-soft);}

.login-error{background:var(--danger-bg);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:9px;margin-bottom:14px;display:none;border:1px solid rgba(255,138,122,0.25);}
.login-error.show{display:block;}

.btn-primary{width:100%;padding:12px 0;margin-top:6px;background:#00311f;border:1px solid #023d27;color:#ffff;border-radius:9px;font-size:13.5px;font-weight:600;transition:filter .15s ease;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:.6;cursor:default;}

.login-hint{font-size:11.5px;color:var(--text-muted);margin-top:16px;text-align:center;}
.mono{font-family:'IBM Plex Mono',monospace;color:#AEB8B3;}

.pulse-line{margin-top:24px;height:20px;}
.pulse-line svg{width:100%;height:100%;display:block;}
.pulse-line path{fill:none;stroke:var(--border);stroke-width:1.5;}
.pulse-line path.accent{stroke:var(--mint);stroke-dasharray:40 400;stroke-dashoffset:0;animation:pulse-run 3.2s linear infinite;}
@keyframes pulse-run{to{stroke-dashoffset:-440;}}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-mark">SC</div>
  <h2>SehatConnectAI</h2>
  <p class="sub">Sign in to the hospital module</p>

  <div class="role-toggle">
    <button type="button" class="active" data-role="admin" onclick="selectRole('admin')">Admin</button>
    <button type="button" data-role="staff" onclick="selectRole('staff')">Staff</button>
  </div>

  <div class="login-error" id="loginError">Invalid username or password.</div>

  <div class="field"><label>Username</label><input id="login_user" placeholder="e.g. admin" autocomplete="username"></div>
  <div class="field"><label>Password</label><input id="login_pass" type="password" placeholder="Enter password" autocomplete="current-password"></div>

  <button class="btn-primary" onclick="attemptLogin()">Sign in as <span id="loginRoleLabel">Admin</span></button>

  <p class="login-hint">Demo credentials — Admin: <span class="mono">admin / admin123</span> 
    · Staff: <span class="mono">staff / staff123</span></p>

  <div class="pulse-line">
    <svg viewBox="0 0 380 20" preserveAspectRatio="none">
      <path d="M0 10 H150 L160 2 L170 18 L180 10 H380" class="base"/>
      <path d="M0 10 H150 L160 2 L170 18 L180 10 H380" class="accent"/>
    </svg>
  </div>
</div>

<script>
const API_BASE = ''; // same-origin — server.js serves this page and the API together
let loginRole = 'admin';

function selectRole(role){
  loginRole = role;
  document.querySelectorAll('.role-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.role===role));
  document.getElementById('loginRoleLabel').textContent = role==='admin' ? 'Admin' : 'Staff';
  document.getElementById('loginError').classList.remove('show');
}

async function attemptLogin(){
  const user = document.getElementById('login_user').value.trim();
  const pass = document.getElementById('login_pass').value;
  const errBox = document.getElementById('loginError');
  const btn = document.querySelector('.btn-primary');

  if(!user || !pass){
    errBox.textContent = 'Enter username and password.';
    errBox.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try{
    const res = await fetch(API_BASE + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username:user, password:pass, role:loginRole })
    });
    const data = await res.json();

    if(res.ok && data.success){
      errBox.classList.remove('show');
      const target = 'hospital-module.html?role=' + encodeURIComponent(data.role) + '&user=' + encodeURIComponent(data.username);
      window.location.href = target;
    }else{
      errBox.textContent = data.message || 'Invalid username or password.';
      errBox.classList.add('show');
    }
  }catch(e){
    errBox.textContent = 'Could not reach the server. Is the backend running?';
    errBox.classList.add('show');
  }finally{
    btn.disabled = false;
    btn.innerHTML = 'Sign in as <span id="loginRoleLabel">' + (loginRole==='admin' ? 'Admin' : 'Staff') + '</span>';
  }
}

document.getElementById('login_user').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
document.getElementById('login_pass').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
</script>
</body>
</html>
