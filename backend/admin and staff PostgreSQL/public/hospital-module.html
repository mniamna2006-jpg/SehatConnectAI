<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Module — Admin + Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8F7;
  --surface:#FFFFFF;
  --surface-2:#EEF3F1;
  --teal:#0E6F5C;
  --teal-dark:#095045;
  --teal-light:#E1F5EE;
  --navy:#16324F;
  --navy-light:#E7EDF3;
  --coral:#E8734A;
  --coral-light:#FBEAE2;
  --text:#1C2B27;
  --text-muted:#64756F;
  --border:#DEE6E2;
  --danger:#C0392B;
  --danger-light:#FBE8E6;
  --ok:#2E7D5B;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,40,35,0.04);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ===== LAYOUT ===== */
#app{display:flex;min-height:100vh;}
.user-chip{display:flex;align-items:center;gap:8px;}
.user-chip .avatar{width:26px;height:26px;border-radius:50%;background:var(--navy-light);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
.logout-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text-muted);}
.logout-btn:hover{background:var(--surface-2);color:var(--text);}

/* SIDEBAR */
#sidebar{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:margin-left .25s ease;}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
.brand h1{font-size:18px;color:var(--teal-dark);}
.brand p{margin:4px 0 0;font-size:12px;color:var(--text-muted);}
.nav-group{padding:14px 10px 4px;}
.nav-group-label{display:flex;align-items:center;gap:8px;padding:4px 10px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
.nav-group-label.admin{color:var(--navy);}
.nav-group-label.staff{color:var(--coral);}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--teal-light);color:var(--teal-dark);font-weight:500;}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0;}
.nav-item.active .dot{background:var(--teal);}

/* pulse ECG divider - signature element */
.pulse-divider{margin:10px 16px 4px;height:26px;}
.pulse-divider svg{width:100%;height:100%;}
.pulse-line{fill:none;stroke:var(--border);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.pulse-glow{fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40 300;animation:pulse-run 3.2s linear infinite;opacity:.85;}
@keyframes pulse-run{to{stroke-dashoffset:-340;}}

/* MAIN */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
#topbar .left h2{font-size:17px;}
#topbar .left p{margin:2px 0 0;font-size:12px;color:var(--text-muted);}
.topbar-right{display:flex;align-items:center;gap:18px;}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);background:var(--surface-2);padding:5px 10px;border-radius:20px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:blink 1.8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
.clock{font-size:12px;color:var(--text-muted);}
.bell{position:relative;font-size:18px;background:none;border:none;color:var(--text);}
.bell .badge{position:absolute;top:-4px;right:-6px;background:var(--coral);color:#fff;font-size:10px;padding:0 4px;border-radius:8px;min-width:14px;text-align:center;}
#content{padding:24px 26px 60px;overflow-y:auto;}
.view{display:none;}
.view.active{display:block;}

/* cards & grids */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.stat-card .label{font-size:12px;color:var(--text-muted);margin-bottom:6px;}
.stat-card .value{font-size:26px;font-family:'Fraunces',serif;font-weight:600;}
.stat-card .sub{font-size:11.5px;color:var(--ok);margin-top:4px;}
.stat-card.icon-card{display:flex;align-items:center;gap:14px;padding:18px 20px;}
.stat-card .icon-box{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.stat-card .icon-box.patients{background:#E8F0FE;color:#1A73E8;}
.stat-card .icon-box.doctors{background:#E6F4EA;color:#137333;}
.stat-card .icon-box.appts{background:#FEF7E0;color:#B06000;}
.stat-card .icon-box.inventory{background:#FCE8E6;color:#C5221F;}
.stat-card .stat-text .value{font-size:28px;line-height:1.1;}
.stat-card .stat-text .label{font-size:13px;margin:0;color:var(--text-muted);}
.appt-list{display:flex;flex-direction:column;gap:0;}
.appt-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--border);}
.appt-row:last-child{border-bottom:none;}
.appt-row .left{display:flex;align-items:center;gap:12px;}
.appt-row .avatar-sm{width:36px;height:36px;border-radius:50%;background:var(--navy-light);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.appt-row .pname{font-weight:500;font-size:14px;}
.appt-row .ptime{font-size:12px;color:var(--text-muted);margin-top:2px;}
.appt-row .right{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:13px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title h3{font-size:15px;}
.section-title:first-child{margin-top:0;}

/* buttons */
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text);}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-danger{background:var(--danger-light);border-color:var(--danger-light);color:var(--danger);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;}

/* table */
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
thead th{background:var(--surface-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:10px 14px;font-weight:600;}
tbody td{padding:11px 14px;border-top:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-wrap table{border:none;}

/* badges */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;}
.badge.pending{background:#FCF3D9;color:#8A6300;}
.badge.confirmed{background:var(--teal-light);color:var(--teal-dark);}
.badge.completed{background:var(--surface-2);color:var(--text-muted);}
.badge.cancelled{background:var(--danger-light);color:var(--danger);}
.badge.available{background:var(--teal-light);color:var(--teal-dark);}
.badge.leave{background:var(--danger-light);color:var(--danger);}
.badge.busy{background:#FCF3D9;color:#8A6300;}

/* forms / modal */
.overlay{position:fixed;inset:0;background:rgba(20,35,30,.4);display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:14px;padding:22px 24px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;}
.modal h3{font-size:16px;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);}
.field textarea{resize:vertical;min-height:60px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.empty{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;}
.empty i{display:block;font-size:12px;color:var(--text-muted);margin-top:4px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.toolbar input[type=search]{padding:8px 12px;border:1px solid var(--border);border-radius:8px;width:220px;background:var(--surface);}
.actions-cell{display:flex;gap:6px;}

/* queue */
.queue-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:8px;}
.queue-num{width:30px;height:30px;border-radius:50%;background:var(--coral-light);color:#A8481E;font-weight:600;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;flex-shrink:0;}
.queue-item .info{flex:1;min-width:0;}
.queue-item .info .pname{font-weight:500;}
.queue-item .info .meta{font-size:12px;color:var(--text-muted);}
.queue-actions{display:flex;gap:6px;}

/* toast */
#toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100;}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.15);animation:toast-in .2s ease;}
.toast.err{background:var(--danger);}
@keyframes toast-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* branding preview */
.brand-preview{display:flex;align-items:center;gap:14px;padding:16px;border:1px dashed var(--border);border-radius:10px;background:var(--surface-2);}
.brand-swatch{width:44px;height:44px;border-radius:10px;flex-shrink:0;}

/* analytics bars */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar-chart .bar{width:100%;background:var(--teal);border-radius:6px 6px 0 0;transition:height .4s ease;}
.bar-chart .bar-label{font-size:11px;color:var(--text-muted);}
.bar-chart .bar-value{font-size:11px;color:var(--text);font-weight:500;}

/* toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);}
.toggle-row:first-child{border-top:none;}
.switch{position:relative;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:.2s;cursor:pointer;}
.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked + .slider{background:var(--teal);}
input:checked + .slider:before{transform:translateX(16px);}

.hint{font-size:12px;color:var(--text-muted);margin-top:-6px;margin-bottom:14px;}

@media(max-width:820px){
  #sidebar{position:fixed;left:0;top:0;z-index:40;margin-left:-250px;box-shadow:0 0 0 9999px rgba(0,0,0,0);}
  #sidebar.open{margin-left:0;box-shadow:0 0 40px rgba(0,0,0,.2);}
  #content{padding:18px;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr;}
  #menu-btn{display:inline-flex !important;}
}
#menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;margin-right:8px;}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1 id="hospitalNameDisplay">SehatConnectAI Hospital</h1>
      <p>Hospital Module</p>
    </div>

    <div class="nav-group">
      <div class="nav-group-label admin">● Admin</div>
      <button class="nav-item active" data-view="admin-dashboard"><span class="dot"></span>Admin dashboard</button>
      <button class="nav-item" data-view="admin-profile"><span class="dot"></span>Hospital profile</button>
      <button class="nav-item" data-view="admin-branding"><span class="dot"></span>Branding</button>
      <button class="nav-item" data-view="admin-departments"><span class="dot"></span>Departments</button>
      <button class="nav-item" data-view="admin-doctors"><span class="dot"></span>Doctors</button>
      <button class="nav-item" data-view="admin-schedules"><span class="dot"></span>Schedules</button>
      <button class="nav-item" data-view="admin-availability"><span class="dot"></span>Availability</button>
      <button class="nav-item" data-view="admin-staff"><span class="dot"></span>Staff management</button>
      <button class="nav-item" data-view="admin-analytics"><span class="dot"></span>Analytics</button>
    </div>

    <div class="pulse-divider">
      <svg viewBox="0 0 220 26" preserveAspectRatio="none">
        <path class="pulse-line" d="M0,13 L60,13 L70,4 L80,22 L90,13 L220,13"/>
        <path class="pulse-glow" d="M0,13 L60,13 L70,4 L80,22 L90,13 L220,13"/>
      </svg>
    </div>

    <div class="nav-group">
      <div class="nav-group-label staff">● Staff</div>
      <button class="nav-item" data-view="staff-dashboard"><span class="dot"></span>Staff dashboard</button>
      <button class="nav-item" data-view="staff-today"><span class="dot"></span>Today's appointments</button>
      <button class="nav-item" data-view="staff-checkin"><span class="dot"></span>Patient check-in</button>
      <button class="nav-item" data-view="staff-queue"><span class="dot"></span>Queue management</button>
      <button class="nav-item" data-view="staff-availability"><span class="dot"></span>Doctor availability</button>
      <button class="nav-item" data-view="staff-profile"><span class="dot"></span>Staff profile / notifications</button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;">
        <button id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div class="left">
          <h2 id="viewTitle">Admin dashboard</h2>
          <p id="viewSub">Overview of hospital operations</p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="clock" id="clock"></span>
        <span class="sync-pill"><span class="sync-dot"></span>Synced</span>
        <button class="bell" title="Notifications">🔔<span class="badge" id="notifCount">0</span></button>
        <div class="user-chip">
          <span class="avatar" id="userAvatar">A</span>
          <span id="userLabel" style="font-size:13px;">Admin</span>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </div>

    <div id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<div id="toast-wrap"></div>

<script>
/* ================= STORAGE / STATE ================= */
const API_BASE = ''; // same-origin — server.js serves this file and the API together

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function defaultData(){
  return {
    profile: { name:'SehatConnectAI Hospital', address:'Plot 14, Shahrah-e-Faisal, Karachi', phone:'+92 21 111 222 333', openingTime:'08:00', closingTime:'22:00', email:'info@stmercy.pk' },
    branding: { primary:'#0E6F5C', secondary:'#16324F', logoText:'SC' },
    departments: [
      { id: uid('dep'), name:'Cardiology', description:'Heart & vascular care', head:'Dr. Ayesha Khan' },
      { id: uid('dep'), name:'Orthopedics', description:'Bone & joint care', head:'Dr. Bilal Ahmed' },
      { id: uid('dep'), name:'Pediatrics', description:'Child healthcare', head:'Dr. Sana Rizvi' }
    ],
    doctors: [],
    staff: [],
    patients: [],
    appointments: [],
    queue: [],
    notifications: [],
    inventory: 200
  };
}

let state = null;
let lastSnapshot = '';
let currentView = 'admin-dashboard';
let currentUser = null; // { username, role }

function getSessionFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role');
  const user = params.get('user');
  if(role === 'admin' || role === 'staff'){
    return { username: user || role, role };
  }
  return null;
}

function logout(){
  window.location.href = 'index.html';
}

function applyRoleAccess(){
  const isStaffOnly = currentUser && currentUser.role === 'staff';
  document.querySelectorAll('.nav-group').forEach((grp)=>{
    const isAdminGroup = grp.querySelector('.nav-group-label.admin');
    if(isAdminGroup) grp.style.display = isStaffOnly ? 'none' : '';
  });
  document.querySelector('.pulse-divider').style.display = isStaffOnly ? 'none' : '';
  if(isStaffOnly && currentView.startsWith('admin-')){
    currentView = 'staff-dashboard';
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===currentView));
  }
  document.getElementById('userAvatar').textContent = currentUser.role==='admin' ? 'A' : 'S';
  document.getElementById('userLabel').textContent = currentUser.role==='admin' ? 'Admin' : 'Staff';
}

async function loadState(){
  try{
    const res = await fetch(API_BASE + '/api/state');
    if(!res.ok) throw new Error('bad response');
    state = await res.json();
  }catch(e){
    state = defaultData();
    toast('Could not reach the database — check the backend server.', true);
  }
  seedIfEmpty();
}

async function saveState(silent){
  try{
    const res = await fetch(API_BASE + '/api/state', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
    if(!res.ok) throw new Error('save failed');
    lastSnapshot = JSON.stringify(state);
  }catch(e){
    if(!silent) toast('Could not save to the database. Try again.', true);
  }
}

function seedIfEmpty(){
  if(state.inventory == null) state.inventory = 200;
  if(state.doctors.length === 0){
    const d1 = state.departments[0].id, d2 = state.departments[1].id, d3 = state.departments[2].id;
    state.doctors.push(
      { id: uid('doc'), name:'Dr. Ayesha Khan', specialization:'Cardiologist', departmentId:d1, phone:'0300-1112233', photoInitials:'AK', availability:'available', schedule:{}, slots:[] },
      { id: uid('doc'), name:'Dr. Bilal Ahmed', specialization:'Orthopedic Surgeon', departmentId:d2, phone:'0300-2223344', photoInitials:'BA', availability:'busy', schedule:{}, slots:[] },
      { id: uid('doc'), name:'Dr. Sana Rizvi', specialization:'Pediatrician', departmentId:d3, phone:'0300-3334455', photoInitials:'SR', availability:'leave', schedule:{}, slots:[] }
    );
  }
  if(state.staff.length === 0){
    state.staff.push(
      { id: uid('stf'), employeeId:'EMP-1001', name:'Mubashir Javaid', role:'Front Desk Coordinator', departmentId:state.departments[0].id, shift:'Morning (8am-4pm)', phone:'0301-9998877', email:'mubashir@sehatconnect.pk', active:true },
      { id: uid('stf'), employeeId:'EMP-1002', name:'Hina Malik', role:'Nurse', departmentId:state.departments[1].id, shift:'Evening (4pm-12am)', phone:'0301-8887766', email:'hina@sehatconnect.pk', active:true }
    );
  }
  if(state.patients.length === 0){
    state.patients.push(
      { id: uid('pat'), name:'Ahmed Raza', phone:'0333-1234567', age:34 },
      { id: uid('pat'), name:'Fatima Noor', phone:'0333-7654321', age:27 },
      { id: uid('pat'), name:'Amina', phone:'0333-1112233', age:29 },
      { id: uid('pat'), name:'Sara', phone:'0333-2223344', age:31 },
      { id: uid('pat'), name:'Zain', phone:'0333-3334455', age:40 },
      { id: uid('pat'), name:'Ali', phone:'0333-4445566', age:25 },
      { id: uid('pat'), name:'Hina', phone:'0333-5556677', age:28 },
      { id: uid('pat'), name:'Usman', phone:'0333-6667788', age:35 }
    );
  }
  if(state.appointments.length === 0){
    const today = new Date().toISOString().slice(0,10);
    const docs = state.doctors;
    const deps = state.departments;
    state.appointments.push(
      { id: uid('apt'), patientName:'Amina', doctorId:docs[0].id, departmentId:deps[0].id, date:today, time:'09:00 AM', status:'confirmed' },
      { id: uid('apt'), patientName:'Sara', doctorId:docs[1].id, departmentId:deps[1].id, date:today, time:'10:00 AM', status:'confirmed' },
      { id: uid('apt'), patientName:'Zain', doctorId:docs[0].id, departmentId:deps[0].id, date:today, time:'11:00 AM', status:'pending' },

/* ================= UTIL ================= */
function toast(msg, isErr){
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function fmtDate(d){ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function docName(id){ const d = state.doctors.find(x=>x.id===id); return d ? d.name : '—'; }
function depName(id){ const d = state.departments.find(x=>x.id===id); return d ? d.name : '—'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Formats a 24h "HH:MM" value (from <input type="time">) as 12-hour "hh:mm AM/PM".
// Strings that already look like 12-hour time (contain AM/PM) or that aren't
// parseable are returned unchanged, so this is safe to run on any stored time value.
function to12h(val){
  if(!val) return '';
  if(/am|pm/i.test(val)) return val;
  const m = /^(\d{1,2}):(\d{2})/.exec(val);
  if(!m) return val;
  let h = parseInt(m[1],10), min = m[2];
  if(isNaN(h)) return val;
  const period = h>=12 ? 'PM' : 'AM';
  let h12 = h % 12; if(h12===0) h12 = 12;
  return `${String(h12).padStart(2,'0')}:${min} ${period}`;
}

async function persistAndRender(msg){
  await saveState();
  if(msg) toast(msg);
  render();
}

function weekBarChart(){
  const days = [...Array(7)].map((_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-6+i);
    return d.toISOString().slice(0,10);
  });
  const counts = days.map(d=>state.appointments.filter(a=>a.date===d).length);
  const max = Math.max(1, ...counts);
  return `<div class="bar-chart">${days.map((d,i)=>`
    <div class="bar-col">
      <div class="bar-value">${counts[i]}</div>
      <div class="bar" style="height:${Math.max(6,(counts[i]/max)*120)}px"></div>
      <div class="bar-label">${new Date(d).toLocaleDateString('en-GB',{weekday:'short'})}</div>
    </div>`).join('')}</div>`;
}

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function renderAdminSchedules(){
  if(state.doctors.length===0) return `<div class="empty">Add a doctor first to set schedules.</div>`;
  return state.doctors.map(d=>{
    if(!d.schedule || typeof d.schedule !== 'object') d.schedule = {};
    const cells = DAYS.map(day=>{
      const slot = d.schedule[day] && typeof d.schedule[day]==='object' ? d.schedule[day] : {start:'',end:''};
      const preview = (slot.start && slot.end) ? `${to12h(slot.start)} – ${to12h(slot.end)}` : 'Off';
      return `<div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">${day}</div>

        <div style="font-size:10.5px;color:var(--text-muted);margin-top:3px;">${preview}</div>
      </div>`;
    }).join('');
    return `
    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:500;margin-bottom:10px;">${escapeHtml(d.name)} <span style="color:var(--text-muted);font-weight:400;font-size:12.5px;">— ${escapeHtml(d.specialization)}</span></div>
      <div class="grid" style="grid-template-columns:repeat(7,1fr);gap:8px;">${cells}</div>
    </div>`;
  }).join('') + `<button class="btn btn-primary" onclick="saveSchedules()">Save all schedules</button>`;
}
async function saveSchedules(){
  document.querySelectorAll('.sched-input').forEach(inp=>{
    const doc = state.doctors.find(x=>x.id===inp.dataset.doc);
    if(!doc) return;
    if(!doc.schedule || typeof doc.schedule !== 'object') doc.schedule = {};
    if(!doc.schedule[inp.dataset.day] || typeof doc.schedule[inp.dataset.day] !== 'object') doc.schedule[inp.dataset.day] = {start:'',end:''};
    doc.schedule[inp.dataset.day][inp.dataset.field] = inp.value;
  });
  await persistAndRender('Schedules saved (times shown in 12-hour format)');
}

  const d = state.doctors.find(x=>x.id===id);
  d.availability = val;
  await persistAndRender('Availability updated');
}
async function addTimeSlot(doctorId){
  const d = state.doctors.find(x=>x.id===doctorId);
  if(!d) return;
  const start = document.getElementById('slot_start_'+doctorId).value;
  const end = document.getElementById('slot_end_'+doctorId).value;
  if(!start || !end){ toast('Pick a start and end time.', true); return; }
  if(!Array.isArray(d.slots)) d.slots = [];
  d.slots.push({id:uid('slot'), start, end, status:'available'});
  await persistAndRender('Time slot added');
}
async function toggleSlotStatus(doctorId, slotId){
  const d = state.doctors.find(x=>x.id===doctorId);
  const s = d && d.slots.find(x=>x.id===slotId);
  if(!s) return;
  s.status = s.status==='booked' ? 'available' : 'booked';
  await persistAndRender('Time slot updated');
}
async function deleteTimeSlot(doctorId, slotId){
  const d = state.doctors.find(x=>x.id===doctorId);
  if(!d) return;
  d.slots = d.slots.filter(x=>x.id!==slotId);

/* ================= APPOINTMENTS TABLE (shared — times shown in 12-hour format) ================= */
function appointmentsTable(list, showActions){
  if(list.length===0) return `<div class="empty">No appointments found.<i>Appointments will appear here once booked.</i></div>`;
  const rows = list.map(a=>`
    <tr>
      <td>${escapeHtml(a.patientName)}</td>
      <td>${escapeHtml(docName(a.doctorId))}</td>
      <td>${escapeHtml(depName(a.departmentId))}</td>
      <td class="mono">${fmtDate(a.date)}, ${escapeHtml(to12h(a.time))}</td>
      <td><span class="badge ${a.status}">${a.status}</span></td>
      ${showActions ? `<td class="actions-cell">
        <button class="btn btn-sm" onclick="setApptStatus('${a.id}','confirmed')">Confirm</button>
        <button class="btn btn-sm" onclick="setApptStatus('${a.id}','completed')">Complete</button>
        <button class="btn btn-sm btn-danger" onclick="setApptStatus('${a.id}','cancelled')">Cancel</button>
      </td>` : ''}
    </tr>`).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th>Patient</th><th>Doctor</th><th>Department</th><th>Date / time</th><th>Status</th>${showActions?'<th></th>':''}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
async function setApptStatus(id, status){
  const a = state.appointments.find(x=>x.id===id);
  a.status = status;
  if(status === 'cancelled'){
    // Consistency verification: drop the patient from any active queue entry
    // tied to this appointment so the live queue never shows a cancelled visit.
    state.queue = state.queue.filter(q => !(q.status !== 'done' && q.patientName === a.patientName && q.doctorId === a.doctorId));
    state.notifications.unshift({id:uid('ntf'), text:`Appointment for ${a.patientName} was cancelled — patient notified`, time:Date.now()});
  }else{
    state.notifications.unshift({id:uid('ntf'), text:`Appointment for ${a.patientName} marked ${status}`, time:Date.now()});
  }
  await persistAndRender('Appointment updated');
}

/* ================= ADMIN: ANALYTICS ================= */
function renderAdminAnalytics(){
  const byDept = state.departments.map(d=>({name:d.name, count: state.appointments.filter(a=>a.departmentId===d.id).length}));
  const maxDept = Math.max(1, ...byDept.map(x=>x.count));
  const byStatus = ['pending','confirmed','completed','cancelled'].map(st=>({name:st, count: state.appointments.filter(a=>a.status===st).length}));
  const maxStatus = Math.max(1, ...byStatus.map(x=>x.count));
  // Aggregate appointment statistics — total / booked (pending+confirmed) / completed / cancelled.
  const totalAppts = state.appointments.length;
  const completedAppts = state.appointments.filter(a=>a.status==='completed').length;
  const cancelledAppts = state.appointments.filter(a=>a.status==='cancelled').length;
  const bookedAppts = totalAppts - completedAppts - cancelledAppts;
  return `
  <div class="grid grid-4">
    <div class="card stat-card"><div class="label">Total appointments</div><div class="value">${totalAppts}</div></div>
    <div class="card stat-card"><div class="label">Booked</div><div class="value">${bookedAppts}</div></div>
    <div class="card stat-card"><div class="label">Completed</div><div class="value">${completedAppts}</div></div>
    <div class="card stat-card"><div class="label">Cancelled</div><div class="value">${cancelledAppts}</div></div>
  </div>
  <div class="grid grid-2">
    <div class="card">
      <h3 style="font-size:14px;margin-bottom:12px;">Appointments by department</h3>
      <div class="bar-chart">${byDept.map(x=>`
        <div class="bar-col"><div class="bar-value">${x.count}</div><div class="bar" style="height:${Math.max(6,(x.count/maxDept)*120)}px"></div><div class="bar-label">${escapeHtml(x.name).slice(0,10)}</div></div>`).join('') || '<div class="empty">No data yet.</div>'}</div>
    </div>
    <div class="card">
      <h3 style="font-size:14px;margin-bottom:12px;">Appointments by status</h3>
      <div class="bar-chart">${byStatus.map(x=>`
        <div class="bar-col"><div class="bar-value">${x.count}</div><div class="bar" style="height:${Math.max(6,(x.count/maxStatus)*120)}px;background:var(--coral);"></div><div class="bar-label">${x.name}</div></div>`).join('')}</div>
    </div>
  </div>
  <div class="section-title"><h3>This week's trend</h3></div>
  <div class="card">${weekBarChart()}</div>
  `;
}

/* ================= STAFF: CHECK-IN (monitor available/booked slots while checking in) ================= */
function slotOptionsFor(doctorId){
  const d = state.doctors.find(x=>x.id===doctorId);
  const slots = d && Array.isArray(d.slots) ? d.slots : [];
  const available = slots.filter(s=>s.status!=='booked');

  return '<option value="">No specific slot</option>' + available.map(s=>`<option value="${s.id}">${to12h(s.start)} – ${to12h(s.end)}</option>`).join('');
}
function refreshSlotOptions(docSelectId, slotSelectId){
  const docId = document.getElementById(docSelectId).value;
  document.getElementById(slotSelectId).innerHTML = slotOptionsFor(docId);
}
function renderStaffCheckin(){
  const patientOptions = state.patients.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} — ${escapeHtml(p.phone)}</option>`).join('');
  const docOptions = state.doctors.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
  const firstDocId = state.doctors[0]?.id || '';
  return `
  <div class="grid grid-2">
    <div class="card">
      <h3 style="font-size:14px;margin-bottom:12px;">Check in existing patient</h3>
      <div class="field"><label>Select patient</label><select id="ci_patient">${patientOptions || '<option value="">No patients yet</option>'}</select></div>
      <div class="field"><label>Assign doctor</label><select id="ci_doctor" onchange="refreshSlotOptions('ci_doctor','ci_slot')">${docOptions || '<option value="">No doctors</option>'}</select></div>
      <div class="field"><label>Time slot</label><select id="ci_slot">${slotOptionsFor(firstDocId)}</select></div>
      <button class="btn btn-primary" onclick="checkInExisting()">Check in and add to queue</button>
    </div>
    <div class="card">
      <h3 style="font-size:14px;margin-bottom:12px;">Add walk-in patient</h3>

      <div class="field"><label>Phone</label><input id="wi_phone" placeholder="03xx-xxxxxxx"></div>
      <div class="field"><label>Assign doctor</label><select id="wi_doctor" onchange="refreshSlotOptions('wi_doctor','wi_slot')">${docOptions || '<option value="">No doctors</option>'}</select></div>
      <div class="field"><label>Time slot</label><select id="wi_slot">${slotOptionsFor(firstDocId)}</select></div>

function bookSlotIfChosen(doctorId, slotId){
  if(!slotId) return '';
  const d = state.doctors.find(x=>x.id===doctorId);
  const s = d && d.slots.find(x=>x.id===slotId);
  if(!s) return '';
  s.status = 'booked';
  return s.start; // 24h "HH:MM" — formatted with to12h wherever it's displayed
}
async function checkInExisting(){
  const patId = document.getElementById('ci_patient').value;
  const docId = document.getElementById('ci_doctor').value;
  const slotId = document.getElementById('ci_slot').value;
  const pat = state.patients.find(p=>p.id===patId);
  if(!pat){ toast('Select a patient first.', true); return; }
  const time = bookSlotIfChosen(docId, slotId);
  addToQueue(pat.name, docId, time);
  await persistAndRender('Patient checked in');
}
async function addWalkIn(){
  const name = document.getElementById('wi_name').value.trim();
  const phone = document.getElementById('wi_phone').value.trim();
  const docId = document.getElementById('wi_doctor').value;
  const slotId = document.getElementById('wi_slot').value;
  if(!name){ toast('Patient name is required.', true); return; }
  const newPat = {id:uid('pat'), name, phone, age:null};
  state.patients.push(newPat);
  const time = bookSlotIfChosen(docId, slotId);
  addToQueue(name, docId, time);
  document.getElementById('wi_name').value=''; document.getElementById('wi_phone').value='';
  await persistAndRender('Walk-in patient checked in');
}
function addToQueue(patientName, doctorId, time){
  const num = state.queue.filter(q=>q.status!=='done').length + 1;
  state.queue.push({id:uid('q'), num, patientName, doctorId, status:'waiting', addedAt:Date.now(), time:time||''});
}

/* ================= STAFF: QUEUE ================= */
function queueApptTime(q){
  // Prefer the time slot booked at check-in; otherwise fall back to a matching
  // appointment for today (same patient + doctor), shown in 12-hour format.
  if(q.time) return to12h(q.time);
  const appt = state.appointments.find(a=>a.date===todayStr() && a.patientName===q.patientName && a.doctorId===q.doctorId);
  return appt ? to12h(appt.time) : '';
}
function renderQueueList(list, showAll){
  if(list.length===0) return `<div class="empty">Queue is empty.<i>Checked-in patients will appear here.</i></div>`;
  return list.map((q,i)=>{
    const waitMin = Math.max(0, Math.round((Date.now()-q.addedAt)/60000));
    const statusBadge = q.status==='waiting' ? 'pending' : (q.status==='in-progress' ? 'confirmed' : 'completed');
    const apptTime = queueApptTime(q);
    return `
    <div class="queue-item">
      <div class="queue-num">${i+1}</div>
      <div class="info">
        <div class="pname">${escapeHtml(q.patientName)}</div>
        <div class="meta">${escapeHtml(docName(q.doctorId))}${apptTime ? ` · ${escapeHtml(apptTime)}` : ''} · waiting ${waitMin} min · <span class="badge ${statusBadge}">${q.status}</span></div>
      </div>
      <div class="queue-actions">
        ${i>0 ? `<button class="btn btn-sm" onclick="moveQueue('${q.id}',-1)" title="Move up">↑</button>` : ''}
        <button class="btn btn-sm" onclick="moveQueue('${q.id}',1)" title="Move down">↓</button>
        ${q.status!=='in-progress' ? `<button class="btn btn-sm" onclick="setQueueStatus('${q.id}','in-progress')">In progress</button>` : ''}
        <button class="btn btn-sm btn-primary" onclick="setQueueStatus('${q.id}','done')">Done</button>
      </div>
    </div>`;
  }).join('');
}
function renderStaffQueue(){
  const active = state.queue.filter(q=>q.status!=='done');
  return `<div>${renderQueueList(active, true)}</div>`;
}
async function moveQueue(id, dir){
  const active = state.queue.filter(q=>q.status!=='done');
  const idx = active.findIndex(q=>q.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=active.length) return;
  const a = active[idx], b = active[swapIdx];
  const realA = state.queue.findIndex(q=>q.id===a.id);
  const realB = state.queue.findIndex(q=>q.id===b.id);
  [state.queue[realA], state.queue[realB]] = [state.queue[realB], state.queue[realA]];
  await persistAndRender();
}
async function setQueueStatus(id, status){
  const q = state.queue.find(x=>x.id===id);
  q.status = status;
  await persistAndRender(status==='done' ? 'Patient marked done' : 'Queue updated');
}

  return `

  <div class="section-title"><h3>Time slots (available / booked)</h3></div>
  ${slotCards}`;
}

  rows.forEach(r=>{ r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none'; });

function wireDynamicHandlers(){ /* reserved for future direct listeners */ }

/* ================= CLOCK ================= */
function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleString('en-GB', {weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
}
setInterval(tickClock, 1000);

/* ================= REAL-TIME SYNC (poll backend) ================= */
async function pollSync(){
  try{
    const res = await fetch(API_BASE + '/api/state');
    if(!res.ok) return;
    const text = await res.text();
    if(text && text !== lastSnapshot){
      state = JSON.parse(text);
      lastSnapshot = text;
      render();
    }
  }catch(e){ /* silent — backend may be briefly unreachable */ }
}
setInterval(pollSync, 4000);

/* ================= BOOT ================= */
(async function boot(){
  currentUser = getSessionFromUrl();
  if(!currentUser){
    window.location.href = 'index.html';
    return;
  }
  await loadState();
  lastSnapshot = JSON.stringify(state);
  tickClock();
  applyRoleAccess();
  render();
})();
</script>
